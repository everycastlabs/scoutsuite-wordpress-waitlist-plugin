# District-style WordPress for the Scout Suite plugin (Find a Group + events).
#
#   docker compose up -d
#
# If a local Scout Suite API is up (wrangler on 8787 or walkthroughs on 8790),
# the seed job creates a District + Groups + events and syncs them in.
# Video walkthroughs do the same automatically — no manual org id or API key.
#
# Site:  http://localhost:8888
# Admin: http://localhost:8888/wp-admin  (admin / scoutsuite)
#
# The seed job is idempotent — safe to re-run:
#   docker compose run --rm seed
name: scoutsuite-wp-demo

services:
  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp_data:/var/www/html
      - ../scout-suite-waiting-list:/var/www/html/wp-content/plugins/scout-suite-waiting-list
      - ./themes/skillsforlife:/var/www/html/wp-content/themes/skillsforlife
      - ./mu-plugins/allow-docker-host-api.php:/var/www/html/wp-content/mu-plugins/allow-docker-host-api.php:ro
      - ./mu-plugins/load-sfl-child-overrides.php:/var/www/html/wp-content/mu-plugins/load-sfl-child-overrides.php:ro
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: wordpress:cli-php8.2
    user: "33:33"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      SCOUTSUITE_ORG_ID: ${SCOUTSUITE_ORG_ID:-}
      SCOUTSUITE_WAITLIST_GROUP_ID: ${SCOUTSUITE_WAITLIST_GROUP_ID:-}
      SCOUTSUITE_API_KEY: ${SCOUTSUITE_API_KEY:-}
      SCOUTSUITE_API_BASE_URL: ${SCOUTSUITE_API_BASE_URL:-http://host.docker.internal:8787}
      SCOUTSUITE_AUTO_SEED: ${SCOUTSUITE_AUTO_SEED:-1}
      SCOUTSUITE_E2E_SECRET: ${SCOUTSUITE_E2E_SECRET:-local-e2e}
      SFL_CHILD_THEME_REPO: ${SFL_CHILD_THEME_REPO:-https://github.com/everycastlabs/sfl-wordpress-child-theme}
      SFL_CHILD_THEME_REF: ${SFL_CHILD_THEME_REF:-main}
    volumes:
      - wp_data:/var/www/html
      - ../scout-suite-waiting-list:/var/www/html/wp-content/plugins/scout-suite-waiting-list
      - ./themes/skillsforlife:/var/www/html/wp-content/themes/skillsforlife
      - ./mu-plugins/allow-docker-host-api.php:/var/www/html/wp-content/mu-plugins/allow-docker-host-api.php:ro
      - ./mu-plugins/load-sfl-child-overrides.php:/var/www/html/wp-content/mu-plugins/load-sfl-child-overrides.php:ro
      - ./seed.sh:/seed.sh:ro
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    entrypoint: ["sh", "/seed.sh"]
    restart: "no"

volumes:
  db_data:
  wp_data:
